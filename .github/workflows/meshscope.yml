# Host-only DOORS app checks; no device, RF or firmware changes.
name: MeshScope host checks
on:
  push:
    branches: [feat/meshscope]
  pull_request:
    paths:
      - 'apps/meshscope/**'
      - 'tests/meshscope*'
      - '.github/workflows/meshscope.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meshscope-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config \
            libsdl2-dev libcjson-dev libpng-dev libjpeg-dev libcurl4-openssl-dev libasound2-dev
      - name: Fetch the existing pinned LVGL
        run: |
          git init vendor/lvgl
          git -C vendor/lvgl remote add origin https://github.com/lvgl/lvgl.git
          git -C vendor/lvgl fetch --depth 1 origin 59dc7e436ae97a25e32656739ea6a943f9f11b6a
          git -C vendor/lvgl checkout --detach FETCH_HEAD
      - name: Model and IPC regressions
        run: |
          make -j2 CFLAGS='-O2 -Wall -Wextra -Werror' tests/meshscope_test \
            tests/rift_rxlog_test tests/rift_ipc_test tests/fake-meshcored tests/home_layout_test
          ./tests/meshscope_test
          ./tests/rift_rxlog_test
          ./tests/rift_ipc_test
          ./tests/home_layout_test
          bash tests/style_lint.sh
      - name: Build DOORS simulator and UI test
        run: |
          cmake -S ui/shell -B out/meshscope-shell
          cmake --build out/meshscope-shell --target pocketos-shell meshscope_ui_test -j2
      - name: Large-text UI and real-socket integration
        env:
          SDL_VIDEODRIVER: dummy
          SHELL_BIN: ${{ github.workspace }}/out/meshscope-shell/pocketos-shell
          SHOTS_DIR: ${{ github.workspace }}/out/meshscope-shots
        run: |
          mkdir -p "$SHOTS_DIR"
          out/meshscope-shell/meshscope_ui_test
          python3 tests/meshscope_shell_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meshscope-simulator-screenshots
          path: out/meshscope-shots
          if-no-files-found: ignore
