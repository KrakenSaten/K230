# Doors: links in shared folders (ADR-016 amendment 3).
# Applied at boot by /etc/init.d/S02sysctl (Buildroot initscripts), which
# reads /etc/sysctl.d/*.conf. Both settings exist since Linux 3.6; the
# image's kernel is 6.6.
#
# A hard link may be made only to a file its maker owns or may read and
# write: a less privileged process (the capture helper's identity) cannot
# give root a second name of a file it should not reach.
fs.protected_hardlinks = 1
# A symbolic link in a sticky, world-writable folder (/tmp) is followed only
# by its owner, or when the folder's owner owns the link.
fs.protected_symlinks = 1
