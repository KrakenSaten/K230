ns-serif" font-size="28" font-weight="600" fill="#eeeae2" text-anchor="start" letter-spacing="0" >Fleet · vs Anna</text><text x="182" y="110" font-family="'IBM Plex Mono',Consolas,monospace" font-size="16" font-weight="500" fill="#f0b23a" text-anchor="start" letter-spacing="1.5" >WAITING FOR ANNA</text><text x="182" y="134" font-family="'IBM Plex Mono',Consolas,monospace" font-size="14" font-weight="400" fill="#a8a399" text-anchor="start" letter-spacing="1.5" >NO WORD FOR 7 MIN · LORA</text><rect x="366" y="122" width="146" height="46" rx="12" fill="#a5f0d2" /><text x="441.0" y="152.2" font-family="'IBM Plex Mono',Consolas,monospace" font-size="20" font-weight="500" fill="#10122e" text-anchor="middle" letter-spacing="3.5" >OPEN</text></g><text x="434" y="272" font-family="'IBM Plex Sans','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#6f6b63" text-anchor="start" letter-spacing="0" >One match per game, on the link it began on.</text><text x="838" y="96" font-family="'IBM Plex Mono',Consolas,monospace" font-size="14" font-weight="500" fill="#c5ccff" text-anchor="start" letter-spacing="2" >3 · OPPONENT OUT OF REACH</text><rect x="838" y="112" width="364" height="200" rx="16" fill="#161513" stroke="#f0b23a" stroke-width="2"/><rect x="858" y="130" width="83" height="28" rx="14" fill="#f0b23a" /><text x="870" y="149" font-family="'IBM Plex Mono',Consolas,monospace" font-size="14" font-weight="500" fill="#10122e" text-anchor="start" letter-spacing="1.5" >PAUSED</text><text x="858" y="196" font-family="'IBM Plex Sans','Segoe UI',sans-serif" font-size="20" font-weight="600" fill="#eeeae2" text-anchor="start" letter-spacing="0" >Anna is out of reach</text><text x="858" y="222" font-family="'IBM Plex Sans','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#a8a399" text-anchor="start" letter-spacing="0" >The match is paused, not lost.</text><text x="858" y="246" font-family="'IBM Plex Mono',Consolas,monospace" font-size="14" font-weight="400" fill="#f0b23a" text-anchor="start" letter-spacing="1.5" >RETRY 5 OF 6 · NEXT IN 40 S</text><rect x="858" y="260" width="170" height="40" rx="12" fill="#f0b23a" /><text x="945.0" y="285.4" font-family="'IBM Plex Mono',Consolas,monospace" font-size="15" font-weight="500" fill="#10122e" text-anchor="middle" letter-spacing="3.5" >CHECK LINK</text><rect x="1040" y="260" width="142" height="40" rx="12" fill="none" stroke="#36332e" stroke-width="2"/><text x="1113.0" y="285.4" font-family="'IBM Plex Mono',Consolas,monospace" font-size="15" font-weight="500" fill="#a8a399" text-anchor="middle" letter-spacing="3.5" >RESUME</text><text x="30" y="456" font-family="'IBM Plex Mono',Consolas,monospace" font-size="14" font-weight="500" fill="#c5ccff" text-anchor="start" letter-spacing="2" >4 · OFFLINE, HONESTLY</text><g transform="translate(30 472) scale(.69)"><rect x="0" y="0" width="528" height="96" rx="16" fill="#161513" stroke="#36332e"/><rect x="16" y="16" width="64" height="64" rx="14" fill="#6f6b63" opacity=".14"/><g transform="translate(48 48) scale(1.0)" fill="none" stroke="#6f6b63" stroke-width="3.4" stroke-linecap="round"><path d="M-15.5 -6.1 A21 21 0 0 1 15.5 -6.1"/><path d="M-10.0 -1.0 A13.5 13.5 0 0 1 10.0 -1.0"/><path d="M-4.4 4.0 A6 6 0 0 1 4.4 4.0"/><circle cx="0" cy="10" r="2.6" fill="#6f6b63" stroke="none"/></g><text x="96" y="42" font-family="'IBM Plex Sans','Segoe UI',sans-serif" font-size="20" font-weight="600" fill="#eeeae2" text-anchor="start" letter-spacing="0" >Local network</text><text x="96" y="66" font-family="'IBM Plex Mono',Consolas,monospace" font-size="14" font-weight="400" fill="#a8a399" text-anchor="start" letter-spacing="1.5" >WI-FI IS OFF · NO CABLE</text><rect x="459" y="18" width="53" height="28" rx="14" fill="none" stroke="#6f6b63" stroke-width="1.5"/><text x="471" y="37" font-family="'IBM Plex Mono',Consolas,monospace" font-size="14" font-weight="500" fill="#6f6b63" text-anchor="start" letter-spacing="1.5" >OFF</text><rect x="0" y="106" width="528" 