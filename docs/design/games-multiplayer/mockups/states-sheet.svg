<svg xmlns="http://www.w3.org/2000/svg" width="1232" height="740" viewBox="0 0 1232 740"><defs><linearGradient id="lob" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1f55"/><stop offset="1" stop-color="#12143a"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1c36"/><stop offset=".62" stop-color="#123a66"/><stop offset="1" stop-color="#0b2444"/></linearGradient><linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1"><stop offset=".45" stop-color="#040a14" stop-opacity="0"/><stop offset="1" stop-color="#040a14" stop-opacity=".88"/></linearGradient><pattern id="stripe" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><rect width="12" height="26" fill="#c5ccff" opacity=".07"/></pattern><radialGradient id="glow"><stop offset="0" stop-color="#8c9aff" stop-opacity=".5"/><stop offset="1" stop-color="#8c9aff" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1232" height="740" rx="0" fill="#0b0b0a" /><text x="30" y="50" font-family="'IBM Plex Sans','Segoe UI',sans-serif" font-size="28" font-weight="600" fill="#eeeae2" text-anchor="start" letter-spacing="0" >Lobby states</text><text x="1202" y="46" font-family="'IBM Plex Mono',Consolas,monospace" font-size="12" font-weight="400" fill="#6f6b63" text-anchor="end" letter-spacing="1.5" >DESIGN MOCKUP · COMPONENTS AT PANEL SCALE · NOT A SCREENSHOT</text><text x="30" y="96" font-family="'IBM Plex Mono',Consolas,monospace" font-size="14" font-weight="500" fill="#c5ccff" text-anchor="start" letter-spacing="2" >1 · INVITATION NOTICE, ANY SCREEN</text><rect x="30" y="112" width="364" height="96" rx="14" fill="#211f1c" stroke="#36332e"/><rect x="30" y="112" width="6" height="96" rx="3" fill="#f0b23a" /><text x="54" y="140" font-family="'IBM Plex Mono',Consolas,monospace" font-size="12" font-weight="500" fill="#f0b23a" text-anchor="start" letter-spacing="1.5" >LOBBY · FLEET</text><text x="54" y="168" font-family="'IBM Plex Sans','Segoe UI',sans-serif" font-size="20" font-weight="600" fill="#eeeae2" text-anchor="start" letter-spacing="0" >Anna invites you</text><text x="54" y="192" font-family="'IBM Plex Sans','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#a8a399" text-anchor="start" letter-spacing="0" >Over LoRa. Tap to answer.</text><circle cx="354" cy="160" r="20" fill="#ff8a6a"/><text x="354" y="167.2" font-family="'IBM Plex Sans Condensed',Bahnschrift,'Arial Narrow',sans-serif" font-size="19.0" font-weight="700" fill="#10122e" text-anchor="middle" letter-spacing="0.5" >AN</text><text x="30" y="242" font-family="'IBM Plex Sans','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#6f6b63" text-anchor="start" letter-spacing="0" >Shown only from a fresh invitation. The</text><text x="30" y="264" font-family="'IBM Plex Sans','Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#6f6b63" text-anchor="start" letter-spacing="0" >shell listens; it never answers by itself.</text><text x="434" y="96" font-family="'IBM Plex Mono',Consolas,monospace" font-size="14" font-weight="500" fill="#c5ccff" text-anchor="start" letter-spacing="2" >2 · RESUME, OPPONENT'S TURN</text><g transform="translate(434 112) scale(.69)"><clipPath id="m1"><rect x="0" y="0" width="528" height="184" rx="18"/></clipPath><rect x="0" y="0" width="528" height="184" rx="18" fill="#161513" /><g clip-path="url(#m1)"><rect x="0" y="0" width="160" height="184" rx="0" fill="url(#sea)" /><path d="M14 0 V184" stroke="#5cc8ff" stroke-width="1" opacity=".16"/><path d="M42 0 V184" stroke="#5cc8ff" stroke-width="1" opacity=".16"/><path d="M70 0 V184" stroke="#5cc8ff" stroke-width="1" opacity=".16"/><path d="M98 0 V184" stroke="#5cc8ff" stroke-width="1" opacity=".16"/><path d="M126 0 V184" stroke="#5cc8ff" stroke-width="1" opacity=".16"/><path d="M154 0 V184" stroke="#5cc8ff" stroke-width="1" opacity=".16"/><path d="M0 14 H160" stroke="#5cc8ff" stroke-width="1" opacity=".16"/><path d="M0 42 H160" s